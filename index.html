<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS2 Case Opening</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 18px;
            color: #f39c12;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
        }

        .balance-box {
            background: #1a1d29;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #252836;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* РУЛЕТКА */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 130px;
            background: #14161f;
            border: 2px solid #252836;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .roulette-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #f39c12;
            z-index: 10;
            box-shadow: 0 0 12px #f39c12;
        }

        .roulette-track {
            display: flex;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
        }

        .item-card {
            min-width: 105px;
            height: 110px;
            margin: 10px 4px;
            background: #1a1d29;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-bottom: 4px solid #fff;
        }

        .item-card img {
            width: 80px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .item-card .name {
            font-size: 10px;
            text-align: center;
            margin-top: 6px;
            font-weight: 600;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 95%;
        }

        /* РЕДКОСТИ */
        .rarity-covert { 
            border-bottom-color: #eb4b4b; 
            background: linear-gradient(180deg, #1a1d29 50%, rgba(235, 75, 75, 0.25));
            box-shadow: inset 0 -10px 15px rgba(235, 75, 75, 0.2);
        }
        .rarity-classified { 
            border-bottom-color: #d32ce6; 
            background: linear-gradient(180deg, #1a1d29 50%, rgba(211, 44, 230, 0.25));
            box-shadow: inset 0 -10px 15px rgba(211, 44, 230, 0.2);
        }
        .rarity-restricted { 
            border-bottom-color: #8847ff; 
            background: linear-gradient(180deg, #1a1d29 50%, rgba(136, 71, 255, 0.


25));
            box-shadow: inset 0 -10px 15px rgba(136, 71, 255, 0.2);
        }
        .rarity-mil-spec { 
            border-bottom-color: #4b69ff; 
            background: linear-gradient(180deg, #1a1d29 50%, rgba(75, 105, 255, 0.25));
            box-shadow: inset 0 -10px 15px rgba(75, 105, 255, 0.2);
        }

        /* КЕЙС */
        .case-preview {
            width: 100%;
            background: #14161f;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #252836;
        }

        .case-img {
            width: 140px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 15px;
            animation: caseFloat 3.5s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
        }

        @keyframes caseFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .case-img.open-anim {
            animation: caseShake 0.5s ease-in-out;
        }

        @keyframes caseShake {
            0% { transform: scale(1) rotate(0); }
            20% { transform: scale(1.1) rotate(-5deg); }
            40% { transform: scale(1.1) rotate(5deg); }
            60% { transform: scale(1.15) rotate(-3deg); }
            80% { transform: scale(1.15) rotate(3deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .btn-open {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            color: #fff;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-open:active { transform: scale(0.97); }
        .btn-open:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.6); }

        /* МОДАЛКА */
        .win-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .win-modal.active { opacity: 1; visibility: visible; }

        .win-card {
            background: #1a1d29;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #f39c12;
            width: 80%;
            max-width: 300px;
            transform: scale(0.7);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(243, 156, 18, 0.3);
        }

        .win-modal.active .win-card {
            transform: scale(1);
        }

        .win-card img {
            width: 130px;
            height: 95px;
            object-fit: contain;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🔥 CS2 CASES</h1>
            <div class="balance-box">
                <span id="userBalance">1000</span> 💎
            </div>
        </div>

        <div class="roulette-wrapper">
            <div class="roulette-track" id="track"></div>
        </div>

        <div class="case-preview">
            <img id="caseImage" src="https://community.akamai.steamstatic.


com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d1y081oBSHi4Lge8828_BFpd654AG6ox12_45Y1D6Ac4E64M454261M14J1F_P4ewJwk216v3dz5R7dq0m461m_P3O73U2DgC75dz3uSUpNmk21fm_UZrZ23zIYLAe1Q7YQ6E81m8ye_v18O4vp3Lz3RmvSAn-z-I_mvb651i2S33-0M4a--C3A" class="case-img" alt="Case">
            <button class="btn-open" id="openBtn" onclick="spinRoulette()">Открыть за 100 💎</button>
        </div>
    </div>

    <div class="win-modal" id="winModal">
        <div class="win-card">
            <h2 style="color: #f39c12;">ПОЗДРАВЛЯЕМ!</h2>
            <p style="margin-top: 5px; color: #aaa;">Вы выбили:</p>
            <img id="winImg" src="" alt="Skin">
            <h3 id="winName" style="color: #fff; font-size: 15px;">---</h3>
            <button class="btn-open" style="margin-top: 15px;" onclick="closeModal()">Забрать</button>
        </div>
    </div>

    <script>
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            try {
                tg.ready();
                tg.expand();
            } catch (e) {
                console.error(e);
            }
        }

        let balance = 1000;
        const casePrice = 100;

        // CDN Ссылки на хостинге Steam
        const skins = [
            { name: "AK-47 | Азимов", rarity: "rarity-covert", img: "https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d1y081oBSHi4Lge8828_BFpd654AG6ox12_45Y1D6Ac4E64M454261M14J1F_P4ewJwk216v3dz5R7dq0m461m_P3O73U2DgC75dz3uSUpNmk21fm_UZrZ23zIYLAe1Q7YQ6E81m8ye_v18O4vp3Lz3RmvSAn-z-I_mvb651i2S33-0M4a--C3A" },
            { name: "M4A4 | Вой", rarity: "rarity-covert", img: "https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d1y081oBSHi4Lge8828_BFpd654AG6ox12_45Y1D6Ac4E64M454261M14J1F_P4ewJwk216v3dz5R7dq0m461m_P3O73U2DgC75dz3uSUpNmk21fm_UZrZ23zIYLAe1Q7YQ6E81m8ye_v18O4vp3Lz3RmvSAn-z-I_mvb651i2S33-0M4a--C3A" },
            { name: "AWP | Скоростной зверь", rarity: "rarity-classified", img: "https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d1y081oBSHi4Lge8828_BFpd654AG6ox12_45Y1D6Ac4E64M454261M14J1F_P4ewJwk216v3dz5R7dq0m461m_P3O73U2DgC75dz3uSUpNmk21fm_UZrZ23zIYLAe1Q7YQ6E81m8ye_v18O4vp3Lz3RmvSAn-z-I_mvb651i2S33-0M4a--C3A" },
            { name: "Glock-18 | Дух воды", rarity: "rarity-restricted", img: "https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d1y081oBSHi4Lge8828_BFpd654AG6ox12_45Y1D6Ac4E64M454261M14J1F_P4ewJwk216v3dz5R7dq0m461m_P3O73U2DgC75dz3uSUpNmk21fm_UZrZ23zIYLAe1Q7YQ6E81m8ye_v18O4vp3Lz3RmvSAn-z-I_mvb651i2S33-0M4a--C3A" },
            { name: "USP-S | Сайрекс", rarity: "rarity-mil-spec", img: "https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d1y081oBSHi4Lge8828_BFpd654AG6ox12_45Y1D6Ac4E64M454261M14J1F_P4ewJwk216v3dz5R7dq0m461m_P3O73U2DgC75dz3uSUpNmk21fm_UZrZ23zIYLAe1Q7YQ6E81m8ye_v18O4vp3Lz3RmvSAn-z-I_mvb651i2S33-0M4a--C3A" }
        ];

        const track = document.getElementById('track');
        const openBtn = document.getElementById('openBtn');
        const balanceEl = document.getElementById('userBalance');
        const caseImg = document.getElementById('caseImage');
        let isSpinning = false;

        function generateTrack() {
            track.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const randomSkin = skins[Math.floor(Math.random() * skins.length)];
                const card = document.createElement('div');
                card.className = item-card ${randomSkin.rarity};
                card.innerHTML = `
                    <img src="${randomSkin.img}" alt="${randomSkin.name}">
                    <div class="name">${randomSkin.name}</div>
                `;
                card.dataset.name = randomSkin.name;
                card.dataset.img = randomSkin.img;
                track.appendChild(card);
            }
        }

        generateTrack();

        function spinRoulette() {


if (isSpinning) return;

            if (balance < casePrice) {
                if (tg && tg.showAlert) tg.showAlert("Недостаточно кристаллов!");
                else alert("Недостаточно кристаллов!");
                return;
            }

            isSpinning = true;
            openBtn.disabled = true;

            balance -= casePrice;
            balanceEl.innerText = balance;

            caseImg.classList.add('open-anim');
            setTimeout(() => caseImg.classList.remove('open-anim'), 500);

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            generateTrack();

            setTimeout(() => {
                const itemWidth = 113;
                const winIndex = 45;
                const winningCard = track.children[winIndex];

                const offset = (winIndex * itemWidth) - (document.querySelector('.roulette-wrapper').offsetWidth / 2) + (itemWidth / 2);

                track.style.transition = 'transform 5s cubic-bezier(0.12, 0.8, 0.15, 1)';
                track.style.transform = translateX(-${offset}px);

                setTimeout(() => {
                    document.getElementById('winName').innerText = winningCard.dataset.name;
                    document.getElementById('winImg').src = winningCard.dataset.img;
                    document.getElementById('winModal').classList.add('active');
                    
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                }, 5200);
            }, 100);
        }

        function closeModal() {
            document.getElementById('winModal').classList.remove('active');
            isSpinning = false;
            openBtn.disabled = false;
        }
    </script>
</body>
</html>
