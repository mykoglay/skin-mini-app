<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS2 Case Opening</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 18px;
            color: #f39c12;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
        }

        .balance-box {
            background: #1a1d29;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #252836;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* РУЛЕТКА */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 130px;
            background: #14161f;
            border: 2px solid #252836;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .roulette-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #f39c12;
            z-index: 10;
            box-shadow: 0 0 12px #f39c12;
        }

        .roulette-track {
            display: flex;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
        }

        .item-card {
            min-width: 105px;
            height: 110px;
            margin: 10px 4px;
            background: #1a1d29;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-bottom: 4px solid #fff;
        }

        .item-card svg {
            width: 60px;
            height: 50px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .item-card .name {
            font-size: 10px;
            text-align: center;
            margin-top: 6px;
            font-weight: 600;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 95%;
        }

        /* РЕДКОСТИ */
        .rarity-covert { 
            border-bottom-color: #eb4b4b; 
            background: linear-gradient(180deg, #1a1d29 50%, rgba(235, 75, 75, 0.25));
        }
        .rarity-classified { 
            border-bottom-color: #d32ce6; 
            background: linear-gradient(180deg, #1a1d29 50%, rgba(211, 44, 230, 0.25));
        }
        .rarity-restricted { 
            border-bottom-color: #8847ff; 
            background: linear-gradient(180deg, #1a1d29 50%, rgba(136, 71, 255, 0.25));
        }
        .rarity-mil-spec { 
            border-bottom-color: #4b69ff; 
            background: linear-gradient(180deg, #1a1d29 50%, rgba(75, 105, 255, 0.


25));
        }

        /* КЕЙС */
        .case-preview {
            width: 100%;
            background: #14161f;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #252836;
        }

        .case-icon {
            width: 100px;
            height: 80px;
            margin-bottom: 15px;
            animation: caseFloat 3.5s ease-in-out infinite;
        }

        @keyframes caseFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .btn-open {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            color: #fff;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
        }

        .btn-open:disabled { opacity: 0.5; cursor: not-allowed; }

        /* МОДАЛКА */
        .win-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .win-modal.active { opacity: 1; visibility: visible; }

        .win-card {
            background: #1a1d29;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #f39c12;
            width: 80%;
            max-width: 300px;
        }

        .win-card svg {
            width: 100px;
            height: 80px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🔥 CS2 CASES</h1>
            <div class="balance-box">
                <span id="userBalance">1000</span> 💎
            </div>
        </div>

        <div class="roulette-wrapper">
            <div class="roulette-track" id="track"></div>
        </div>

        <div class="case-preview">
            <div class="case-icon">
                <svg viewBox="0 0 64 48" fill="none">
                    <rect x="2" y="10" width="60" height="34" rx="4" fill="#2c3e50" stroke="#f39c12" stroke-width="3"/>
                    <path d="M2 18H62" stroke="#f39c12" stroke-width="2"/>
                    <rect x="26" y="20" width="12" height="10" rx="2" fill="#f39c12"/>
                </svg>
            </div>
            <button class="btn-open" id="openBtn">Открыть за 100 💎</button>
        </div>
    </div>

    <div class="win-modal" id="winModal">
        <div class="win-card">
            <h2 style="color: #f39c12;">ПОЗДРАВЛЯЕМ!</h2>
            <p style="margin-top: 5px; color: #aaa;">Вы выбили:</p>
            <div id="winSvgContainer"></div>
            <h3 id="winName" style="color: #fff; font-size: 15px;">---</h3>
            <button class="btn-open" style="margin-top: 15px;" id="closeBtn">Забрать</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try { tg.ready(); tg.expand(); } catch(e){}
        }

        let balance = 1000;
        const casePrice = 100;

        const weaponSvg = <svg viewBox="0 0 64 40" fill="none"><path d="M8 26L22 26L28 14L56 14L58 20L44 22L42 28L12 28Z" fill="#e74c3c"/><rect x="4" y="24" width="8" height="10" fill="#7f8c8d"/></svg>;

        const skins = [
            { name: "AK-47 | Азимов", rarity: "rarity-covert", svg: weaponSvg },
            { name: "M4A4 | Вой", rarity: "rarity-covert", svg: weaponSvg },


{ name: "AWP | Скоростной зверь", rarity: "rarity-classified", svg: weaponSvg },
            { name: "Glock-18 | Дух воды", rarity: "rarity-restricted", svg: weaponSvg },
            { name: "USP-S | Сайрекс", rarity: "rarity-mil-spec", svg: weaponSvg }
        ];

        const track = document.getElementById('track');
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        const balanceEl = document.getElementById('userBalance');
        let isSpinning = false;

        function generateTrack() {
            track.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const randomSkin = skins[Math.floor(Math.random() * skins.length)];
                const card = document.createElement('div');
                card.className = item-card ${randomSkin.rarity};
                card.innerHTML = ${randomSkin.svg}<div class="name">${randomSkin.name}</div>;
                card.dataset.name = randomSkin.name;
                track.appendChild(card);
            }
        }

        generateTrack();

        openBtn.addEventListener('click', () => {
            if (isSpinning) return;

            if (balance < casePrice) {
                alert("Недостаточно кристаллов!");
                return;
            }

            isSpinning = true;
            openBtn.disabled = true;

            balance -= casePrice;
            balanceEl.innerText = balance;

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            generateTrack();

            setTimeout(() => {
                const itemWidth = 113;
                const winIndex = 45;
                const winningCard = track.children[winIndex];

                const offset = (winIndex * itemWidth) - (document.querySelector('.roulette-wrapper').offsetWidth / 2) + (itemWidth / 2);

                track.style.transition = 'transform 5s cubic-bezier(0.12, 0.8, 0.15, 1)';
                track.style.transform = translateX(-${offset}px);

                setTimeout(() => {
                    document.getElementById('winName').innerText = winningCard.dataset.name;
                    document.getElementById('winSvgContainer').innerHTML = weaponSvg;
                    document.getElementById('winModal').classList.add('active');
                }, 5200);
            }, 50);
        });

        closeBtn.addEventListener('click', () => {
            document.getElementById('winModal').classList.remove('active');
            isSpinning = false;
            openBtn.disabled = false;
        });
    </script>
</body>
</html>
