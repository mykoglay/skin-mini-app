<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Cases</title>
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #0d0e12; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .header { height: 50px; background: #14161f; border-bottom: 1px solid #252836; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; flex-shrink: 0; }
        .header h1 { font-size: 15px; color: #f39c12; font-weight: 800; }
        .balance { background: #1a1d29; padding: 6px 12px; border-radius: 20px; border: 1px solid #252836; font-size: 13px; font-weight: bold; }
        
        .main-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .page { display: none; width: 100%; height: 100%; padding: 16px; flex-direction: column; align-items: center; overflow-y: auto; }
        .page.active { display: flex; }
        
        .roulette-box { position: relative; width: 100%; height: 110px; background: #14161f; border: 2px solid #252836; border-radius: 12px; overflow: hidden; margin-bottom: 15px; flex-shrink: 0; }
        .roulette-line { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 3px; height: 100%; background: #f39c12; z-index: 10; box-shadow: 0 0 8px #f39c12; }
        .roulette-track { display: flex; height: 100%; position: absolute; left: 0; top: 0; will-change: transform; }
        
        .skin-card { min-width: 90px; width: 90px; height: 85px; margin: 10px 4px; background: #1a1d29; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; border-bottom: 4px solid #fff; flex-shrink: 0; }
        .skin-card img { width: 65px; height: 45px; object-fit: contain; }
        .skin-card .title { font-size: 9px; text-align: center; color: #ddd; font-weight: 600; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        
        .covert { border-bottom-color: #eb4b4b; background: linear-gradient(180deg, #1a1d29 20%, rgba(235, 75, 75, 0.25)); }
        .classified { border-bottom-color: #d32ce6; background: linear-gradient(180deg, #1a1d29 20%, rgba(211, 44, 230, 0.25)); }
        .restricted { border-bottom-color: #8847ff; background: linear-gradient(180deg, #1a1d29 20%, rgba(136, 71, 255, 0.25)); }
        
        .case-card { width: 100%; background: #14161f; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; border: 1px solid #252836; }
        .case-icon { width: 80px; height: 60px; background: #f39c12; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 0 15px rgba(243, 156, 18, 0.3); }
        
        .btn { width: 100%; background: linear-gradient(135deg, #f39c12, #e67e22); border: none; color: #fff; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; text-align: center; }
        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-green { background: linear-gradient(135deg, #27ae60, #2ec771); }
        .btn-gray { background: #252836; color: #ccc; }
        
        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .inv-card { background: #14161f; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; border: 1px solid #252836; }
        .inv-card img { width: 60px; height: 40px; object-fit: contain; }
        .inv-card .


title { font-size: 9px; text-align: center; color: #aaa; margin: 4px 0; height: 22px; overflow: hidden; }
        .inv-card .price { font-size: 11px; font-weight: bold; color: #2ec771; margin-bottom: 6px; }
        
        /* Профиль */
        .profile-card { width: 100%; background: #14161f; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; border: 1px solid #252836; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #f39c12; margin-bottom: 10px; object-fit: cover; }
        .profile-name { font-size: 16px; font-weight: bold; color: #fff; }
        .profile-username { font-size: 13px; color: #7f8c8d; margin-bottom: 6px; }
        .profile-id { font-size: 12px; color: #f39c12; background: rgba(243, 156, 18, 0.1); padding: 4px 10px; border-radius: 10px; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); z-index: 999999; justify-content: center; align-items: center; }
        .modal.active { display: flex !important; }
        .modal-card { background: #1a1d29; padding: 20px; border-radius: 16px; text-align: center; border: 2px solid #f39c12; width: 85%; max-width: 300px; display: flex; flex-direction: column; align-items: center; }
        .modal-card img { width: 120px; height: 80px; object-fit: contain; margin: 10px 0; }
        .modal-btns { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        
        .nav-bar { height: 60px; background: #14161f; border-top: 1px solid #252836; display: flex; width: 100%; flex-shrink: 0; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; color: #7f8c8d; font-size: 13px; font-weight: bold; cursor: pointer; background: transparent; border: none; }
        .nav-item.active { color: #f39c12; background: rgba(243, 156, 18, 0.05); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 CS2 CASES</h1>
        <div class="balance"><span id="balVal">1000</span> 💎</div>
    </div>

    <div class="main-container">
        <!-- Кейсы -->
        <div id="pCases" class="page active">
            <div class="roulette-box">
                <div class="roulette-line"></div>
                <div class="roulette-track" id="track"></div>
            </div>

            <div class="case-card">
                <div class="case-icon">🧰</div>
                <button class="btn" id="openBtn" onclick="spinRoulette()">Открыть за 100 💎</button>
            </div>
        </div>

        <!-- Инвентарь -->
        <div id="pInv" class="page">
            <div class="inventory-grid" id="invGrid"></div>
        </div>

        <!-- Профиль -->
        <div id="pProf" class="page">
            <div class="profile-card">
                <img id="uAvatar" class="profile-avatar" src="https://ui-avatars.com/api/?name=User&background=f39c12&color=fff" alt="Avatar">
                <div class="profile-name" id="uName">Игрок</div>
                <div class="profile-username" id="uUsername">@username</div>
                <div class="profile-id" id="uId">ID: 000000000</div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" id="btnCases" onclick="switchTab('Cases', this)">Кейсы</button>
        <button class="nav-item" id="btnInv" onclick="switchTab('Inv', this)">Инвентарь</button>
        <button class="nav-item" id="btnProf" onclick="switchTab('Prof', this)">Профиль</button>
    </div>

    <!-- Модальное окно выигрыша -->
    <div class="modal" id="winModal">
        <div class="modal-card">
            <h2 style="color: #f39c12; font-size: 16px;">ВЫ ВЫБИЛИ!</h2>
            <img id="mImg" src="" alt="Skin">
            <h3 id="mTitle" style="font-size: 13px; color: #fff;">---</h3>
            <p id="mPrice" style="color: #2ec771; font-weight: bold; font-size: 13px; margin-top: 4px;">0 💎</p>
            
            <div class="modal-btns">


<button class="btn btn-green" id="mSellBtn">Продать сходу</button>
                <button class="btn btn-gray" id="mKeepBtn">Оставить в инвентаре</button>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        var tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        // Скины с валидными прямыми ссылками на картинки
        var skins = [
            { id: 1, name: "AK-47 | Asiimov", rarity: "covert", price: 450, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4R71FAzo4_2cWHZuqRI14vSE4BEW8i_840c8pS-gI-S1E6061n8a8_Jgw-JgtRuO3_fA41g_L3fTxO7c6x29bfk-KgZb2GxjNW6J10j7-Up92l0QThqkNsZG_3IYXAewQ_aAnSq1DrlerK18S97p3M1zI97eH83nI" },
            { id: 2, name: "M4A4 | Howl", rarity: "covert", price: 600, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4R71FAzo4_2cWHZuqRI14vSE4BEW8i_840c8pS-gI-S1E6061n8a8_Jgw1Jh82cQC2v767FAZ3iP33fThI482_m9S3l_ChZuLSxT4H6cRz2-3Co9Sk2QWyqE49Nm-mLI6ccAYaMN9IS6LsqA" },
            { id: 3, name: "AWP | Hyper Beast", rarity: "classified", price: 250, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4R71FAzo4_2cWHZuqRI14vSE4BEW8i_840c8pS-gI-S1E6061n8a8_Jgw-JgtRtOf8fz943f33ey1R59m029S1m8j4Y-OFw39T6cBz3L2So92l3A2x_xU9Nzyld9WdJwY2MwqEq1W7yObLp8W93m35" },
            { id: 4, name: "Glock-18 | Water Elemental", rarity: "restricted", price: 120, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4R71FAzo4_2cWHZuqRI14vSE4BEW8i_840c8pS-gI-S1E6061n8a8_Jgw-JgtRtOn8ezR42v33ey1R59m029_i_C4IYeG333xU4pwi0urEp9n01AS_qkdtMmHzctCddARoZA3Ur1m6k-3o0MW_41fO12A" },
            { id: 5, name: "USP-S | Cyrex", rarity: "restricted", price: 70, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4R71FAzo4_2cWHZuqRI14vSE4BEW8i_840c8pS-gI-S1E6061n8a8_Jgw-JgtRtOv_ezV42v33ey1R59m028_x1C4GYOHx33sIvcB32rCS94j21g3grkRkZmzxJ9XBdANsZQmD-1jrwr26" }
        ];

        // Загрузка сохраненного состояния из localStorage
        var balance = parseInt(localStorage.getItem("cs_balance")) || 1000;
        var inventory = JSON.parse(localStorage.getItem("cs_inventory")) || [];
        
        var isSpinning = false;
        var currentWin = null;

        var track = document.getElementById("track");
        var openBtn = document.getElementById("openBtn");

        function saveData() {
            localStorage.setItem("cs_balance", balance);
            localStorage.setItem("cs_inventory", JSON.stringify(inventory));
        }

        function initProfile() {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                var u = tg.initDataUnsafe.user;
                document.getElementById("uName").innerText = (u.first_name  "") + " " + (u.last_name  "");
                document.getElementById("uUsername").innerText = u.username ? "@" + u.username : "нет юзернейма";
                document.getElementById("uId").innerText = "ID: " + u.id;
                if (u.photo_url) {
                    document.getElementById("uAvatar").src = u.photo_url;
                } else {
                    document.getElementById("uAvatar").src = "https://ui-avatars.com/api/?name=" + encodeURIComponent(u.first_name) + "&background=f39c12&color=fff";
                }
            } else {
                document.getElementById("uName").innerText = "Тестовый Юзер";
                document.getElementById("uUsername").innerText = "@test_user";
                document.getElementById("uId").innerText = "ID: 123456789";
            }
        }

        function buildTrack() {
            track.innerHTML = "";
            for (var i = 0; i < 60; i++) {
                var skin = skins[Math.floor(Math.random() * skins.length)];
                var card = document.createElement("div");
                card.className = "skin-card " + skin.rarity;
                card.


innerHTML = '<img src="' + skin.img + '"><div class="title">' + skin.name + '</div>';
                card.dataset.id = skin.id;
                track.appendChild(card);
            }
        }

        function switchTab(tabName, btn) {
            if (isSpinning) return;
            
            var pages = document.querySelectorAll(".page");
            for (var i = 0; i < pages.length; i++) pages[i].classList.remove("active");

            var navs = document.querySelectorAll(".nav-item");
            for (var j = 0; j < navs.length; j++) navs[j].classList.remove("active");

            document.getElementById("p" + tabName).classList.add("active");
            btn.classList.add("active");

            if (tabName === "Inv") renderInventory();
        }

        function spinRoulette() {
            if (isSpinning) return;
            if (balance < 100) {
                alert("Недостаточно кристаллов!");
                return;
            }

            isSpinning = true;
            openBtn.disabled = true;
            balance -= 100;
            document.getElementById("balVal").innerText = balance;
            saveData();

            track.style.transition = "none";
            track.style.transform = "translateX(0px)";
            buildTrack();

            setTimeout(function() {
                var cardWidth = 98;
                var winIndex = 35;
                var offset = Math.floor(Math.random() * 40) - 20;
                var wrapperWidth = track.parentElement.offsetWidth;
                var targetX = (winIndex * cardWidth) - (wrapperWidth / 2) + (cardWidth / 2) + offset;

                track.style.transition = "transform 4.5s cubic-bezier(0.1, 0.8, 0.1, 1)";
                track.style.transform = "translateX(-" + targetX + "px)";

                setTimeout(function() {
                    var winCard = track.children[winIndex];
                    var winId = winCard.dataset.id;
                    for (var k = 0; k < skins.length; k++) {
                        if (skins[k].id == winId) {
                            currentWin = skins[k];
                            break;
                        }
                    }
                    showWinModal(currentWin);
                }, 4700);
            }, 50);
        }

        function showWinModal(skin) {
            document.getElementById("mImg").src = skin.img;
            document.getElementById("mTitle").innerText = skin.name;
            document.getElementById("mPrice").innerText = "+" + skin.price + " 💎";
            document.getElementById("mSellBtn").innerText = "Продать за " + skin.price + " 💎";
            document.getElementById("winModal").classList.add("active");
        }

        document.getElementById("mSellBtn").onclick = function() {
            if (!currentWin) return;
            balance += currentWin.price;
            document.getElementById("balVal").innerText = balance;
            saveData();
            closeWinModal();
        };

        document.getElementById("mKeepBtn").onclick = function() {
            if (!currentWin) return;
            inventory.push({
                id: currentWin.id,
                name: currentWin.name,
                rarity: currentWin.rarity,
                price: currentWin.price,
                img: currentWin.img,
                instId: Date.now() + Math.random()
            });
            saveData();
            closeWinModal();
        };

        function closeWinModal() {
            document.getElementById("winModal").classList.remove("active");
            currentWin = null;
            isSpinning = false;
            openBtn.disabled = false;
        }

        function renderInventory() {
            var grid = document.getElementById("invGrid");
            grid.innerHTML = "";

            if (inventory.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #7f8c8d; font-size: 13px; margin-top: 20px;">Инвентарь пуст</p>';
                return;
            }

            for (var i = 0; i < inventory.


length; i++) {
                var item = inventory[i];
                var card = document.createElement("div");
                card.className = "inv-card " + item.rarity;
                card.innerHTML = 
                    '<img src="' + item.img + '">' +
                    '<div class="title">' + item.name + '</div>' +
                    '<div class="price">' + item.price + ' 💎</div>' +
                    '<button class="btn btn-green" style="padding: 4px; font-size: 10px;" onclick="sellFromInv(' + item.instId + ')">Продать</button>';
                grid.appendChild(card);
            }
        }

        window.sellFromInv = function(instId) {
            var idx = -1;
            for (var i = 0; i < inventory.length; i++) {
                if (inventory[i].instId === instId) {
                    idx = i;
                    break;
                }
            }
            if (idx !== -1) {
                balance += inventory[idx].price;
                document.getElementById("balVal").innerText = balance;
                inventory.splice(idx, 1);
                saveData();
                renderInventory();
            }
        };

        // Запуск
        document.getElementById("balVal").innerText = balance;
        initProfile();
        buildTrack();
    </script>
</body>
</html>
