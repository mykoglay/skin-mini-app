<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS2 Case Opening</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            color: #f39c12;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
        }

        /* РУЛЕТКА */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 130px;
            background: #14161f;
            border: 2px solid #252836;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .roulette-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #f39c12;
            z-index: 10;
            box-shadow: 0 0 8px #f39c12;
        }

        .roulette-track {
            display: flex;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
        }

        .item-card {
            min-width: 105px;
            height: 110px;
            margin: 10px 4px;
            background: #1a1d29;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-bottom: 4px solid #fff;
        }

        .item-card img {
            width: 75px;
            height: 55px;
            object-fit: contain;
        }

        .item-card .name {
            font-size: 10px;
            text-align: center;
            margin-top: 6px;
            font-weight: 600;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 95%;
        }

        /* РЕДКОСТИ */
        .rarity-covert { border-bottom-color: #eb4b4b; background: linear-gradient(180deg, #1a1d29 60%, rgba(235, 75, 75, 0.15)); }
        .rarity-classified { border-bottom-color: #d32ce6; background: linear-gradient(180deg, #1a1d29 60%, rgba(211, 44, 230, 0.15)); }
        .rarity-restricted { border-bottom-color: #8847ff; background: linear-gradient(180deg, #1a1d29 60%, rgba(136, 71, 255, 0.15)); }
        .rarity-mil-spec { border-bottom-color: #4b69ff; background: linear-gradient(180deg, #1a1d29 60%, rgba(75, 105, 255, 0.15)); }

        /* КЕЙС */
        .case-preview {
            width: 100%;
            background: #14161f;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #252836;
        }

        .case-img {
            width: 130px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }


.btn-open {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            color: #fff;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-open:active { transform: scale(0.98); }
        .btn-open:disabled { opacity: 0.5; cursor: not-allowed; }

        /* МОДАЛКА */
        .win-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .win-modal.active { opacity: 1; visibility: visible; }

        .win-card {
            background: #1a1d29;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #f39c12;
            width: 80%;
            max-width: 300px;
        }

        .win-card img {
            width: 120px;
            height: 90px;
            object-fit: contain;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🔥 CS2 CASE OPENING</h1>
        </div>

        <div class="roulette-wrapper">
            <div class="roulette-track" id="track"></div>
        </div>

        <div class="case-preview">
            <img src="https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/images/econ/weapon_cases/crate_weapon_case_01.png" class="case-img" alt="Case">
            <button class="btn-open" id="openBtn" onclick="spinRoulette()">Открыть за 100 ₽</button>
        </div>
    </div>

    <div class="win-modal" id="winModal">
        <div class="win-card">
            <h2 style="color: #f39c12;">ПОЗДРАВЛЯЕМ!</h2>
            <p style="margin-top: 5px; color: #aaa;">Вы выбили:</p>
            <img id="winImg" src="" alt="Skin">
            <h3 id="winName" style="color: #fff; font-size: 15px;">---</h3>
            <button class="btn-open" style="margin-top: 15px;" onclick="closeModal()">Забрать</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const skins = [
            { name: "AK-47 | Азимов", rarity: "rarity-covert", img: "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/images/econ/default_generated/weapon_ak47_cu_ak47_asiimov_light_large.png" },
            { name: "M4A4 | Вой", rarity: "rarity-covert", img: "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/images/econ/default_generated/weapon_m4a1_cu_howl_light_large.png" },
            { name: "AWP | Скоростной зверь", rarity: "rarity-classified", img: "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/images/econ/default_generated/weapon_awp_cu_awp_hyper_beast_light_large.png" },
            { name: "Glock-18 | Дух воды", rarity: "rarity-restricted", img: "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/images/econ/default_generated/weapon_glock_cu_water_elemental_light_large.png" },
            { name: "USP-S | Сайрекс", rarity: "rarity-mil-spec", img: "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/images/econ/default_generated/weapon_usp_silencer_cu_usps_cyrex_light_large.png" }
        ];

        const track = document.getElementById('track');
        const openBtn = document.getElementById('openBtn');
        let isSpinning = false;

        function generateTrack() {
            track.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const randomSkin = skins[Math.floor(Math.random() * skins.length)];
                const card = document.


createElement('div');
                card.className = item-card ${randomSkin.rarity};
                card.innerHTML = `
                    <img src="${randomSkin.img}" alt="${randomSkin.name}">
                    <div class="name">${randomSkin.name}</div>
                `;
                card.dataset.name = randomSkin.name;
                card.dataset.img = randomSkin.img;
                track.appendChild(card);
            }
        }

        generateTrack();

        function spinRoulette() {
            if (isSpinning) return;
            isSpinning = true;
            openBtn.disabled = true;

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            generateTrack();

            setTimeout(() => {
                const itemWidth = 113;
                const winIndex = 45;
                const winningCard = track.children[winIndex];

                const offset = (winIndex * itemWidth) - (document.querySelector('.roulette-wrapper').offsetWidth / 2) + (itemWidth / 2);

                track.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.2, 1)';
                track.style.transform = translateX(-${offset}px);

                setTimeout(() => {
                    document.getElementById('winName').innerText = winningCard.dataset.name;
                    document.getElementById('winImg').src = winningCard.dataset.img;
                    document.getElementById('winModal').classList.add('active');
                    
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                }, 5200);
            }, 50);
        }

        function closeModal() {
            document.getElementById('winModal').classList.remove('active');
            isSpinning = false;
            openBtn.disabled = false;
        }
    </script>
</body>
</html>
