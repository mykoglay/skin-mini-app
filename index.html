<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Cases</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ШАПКА */
        .header {
            height: 50px;
            background: #14161f;
            border-bottom: 1px solid #252836;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 15px;
            color: #f39c12;
            font-weight: 800;
        }

        .balance {
            background: #1a1d29;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #252836;
            font-size: 13px;
            font-weight: bold;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .main-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            padding: 16px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .page.active {
            display: flex;
        }

        /* РУЛЕТКА */
        .roulette-box {
            position: relative;
            width: 100%;
            height: 110px;
            background: #14161f;
            border: 2px solid #252836;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .roulette-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #f39c12;
            z-index: 10;
            box-shadow: 0 0 8px #f39c12;
        }

        .roulette-track {
            display: flex;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
        }

        .skin-card {
            min-width: 90px;
            width: 90px;
            height: 85px;
            margin: 10px 4px;
            background: #1a1d29;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-bottom: 4px solid #fff;
            flex-shrink: 0;
        }

        .skin-card img {
            width: 60px;
            height: 40px;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .skin-card .title {
            font-size: 9px;
            text-align: center;
            color: #ddd;
            font-weight: 600;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ЦВЕТА РЕДКОСТИ */
        .covert { border-bottom-color: #eb4b4b; background: linear-gradient(180deg, #1a1d29 20%, rgba(235, 75, 75, 0.2)); }
        .classified { border-bottom-color: #d32ce6; background: linear-gradient(180deg, #1a1d29 20%, rgba(211, 44, 230, 0.2)); }
        .restricted { border-bottom-color: #8847ff; background: linear-gradient(180deg, #1a1d29 20%, rgba(136, 71, 255, 0.2)); }

        /* КЕЙС */
        .case-card {


width: 100%;
            background: #14161f;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #252836;
        }

        .case-icon {
            width: 100px;
            height: 70px;
            background: #f39c12;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.3);
        }

        /* КНОПКИ */
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            color: #fff;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }

        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-green { background: linear-gradient(135deg, #27ae60, #2ec771); }
        .btn-gray { background: #252836; color: #ccc; }

        /* ИНВЕНТАРЬ */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .inv-card {
            background: #14161f;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #252836;
        }

        .inv-card img { width: 50px; height: 35px; object-fit: contain; margin-bottom: 4px; }
        .inv-card .title { font-size: 9px; text-align: center; color: #aaa; margin-bottom: 4px; height: 22px; overflow: hidden; }
        .inv-card .price { font-size: 11px; font-weight: bold; color: #2ec771; margin-bottom: 6px; }

        /* ВСПЛЫВАЮЩЕЕ ОКНО ВЫИГРЫША */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 999999;
            justify-content: center;
            align-items: center;
        }

        .modal.active { display: flex !important; }

        .modal-card {
            background: #1a1d29;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #f39c12;
            width: 85%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-card img { width: 100px; height: 60px; object-fit: contain; margin: 15px 0; }
        .modal-btns { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }

        /* НИЖНЕЕ МЕНЮ */
        .nav-bar {
            height: 60px;
            background: #14161f;
            border-top: 1px solid #252836;
            display: flex;
            width: 100%;
            flex-shrink: 0;
            z-index: 99999;
            position: relative;
        }

        .nav-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
        }

        .nav-item.active {
            color: #f39c12;
            background: rgba(243, 156, 18, 0.05);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 CS2 CASES</h1>
        <div class="balance"><span id="balVal">1000</span> 💎</div>
    </div>

    <div class="main-container">
        <!-- ВКТАДКА: КЕЙСЫ -->
        <div id="pCases" class="page active">
            <div class="roulette-box">


<div class="roulette-line"></div>
                <div class="roulette-track" id="track"></div>
            </div>

            <div class="case-card">
                <div class="case-icon">🧰</div>
                <button class="btn" id="openBtn">Открыть за 100 💎</button>
            </div>
        </div>

        <!-- ВКЛАДКА: ИНВЕНТАРЬ -->
        <div id="pInv" class="page">
            <div class="inventory-grid" id="invGrid"></div>
        </div>

        <!-- ВКЛАДКА: ПРОФИЛЬ -->
        <div id="pProf" class="page">
            <p style="text-align: center; color: #aaa; margin-top: 20px;">Мой Профиль</p>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div class="nav-bar">
        <button class="nav-item active" id="btnCases">Кейсы</button>
        <button class="nav-item" id="btnInv">Инвентарь</button>
        <button class="nav-item" id="btnProf">Профиль</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ВЫИГРЫША -->
    <div class="modal" id="winModal">
        <div class="modal-card">
            <h2 style="color: #f39c12; font-size: 16px;">ВЫ ВЫБИЛИ!</h2>
            <img id="mImg" src="" alt="Skin">
            <h3 id="mTitle" style="font-size: 13px; color: #fff;">---</h3>
            <p id="mPrice" style="color: #2ec771; font-weight: bold; font-size: 13px; margin-top: 4px;">0 💎</p>
            
            <div class="modal-btns">
                <button class="btn btn-green" id="mSellBtn">Продать сходу</button>
                <button class="btn btn-gray" id="mKeepBtn">Оставить в инвентаре</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // Векторные SVG-картинки стволов в формате Base64 (100% отображение везде)
            const imgAK = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgNTAiPjxwYXRoIGQ9Ik01IDI4IEwyNSAyOCBMMzUgMTUgTDc1IDE1IEw4NSAyMiBMOTUgMjQgTDk1IDI4IEw4MCAzMCBMNjAgMzAgTDU1IDM4IEw0NSAzOCBMNDggMzAgTDIwIDMwIFoiIGZpbGw9IiNlYjRiNGIiLz48cmVjdCB4PSIzNSIgeT0iMTgiIHdpZHRoPSIyMCIgaGVpZ2h0PSI2IiBmaWxsPSIjMmMzZTUwIi8+PC9zdmc+";
            const imgM4 = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgNTAiPjxwYXRoIGQ9Ik04IDI2IEwyOCAyNiBMMDggMTQgTDgwIDE0IEw4OCAyMCBMOTYgMjIgTDk2IDI2IEw3OCAyOCBMNTggMjggTDUyIDM4IEw0MiAzOCBMNDYgMjggTDE4IDI4IFoiIGZpbGw9IiNkMzJjZTYiLz48cmVjdCB4PSI0MCIgeT0iMTYiIHdpZHRoPSIyNSIgaGVpZ2h0PSI1IiBmaWxsPSIjZjFjNDBmIi8+PC9zdmc+";
            const imgAWP = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgNTAiPjxwYXRoIGQ9Ik0yIDI0IEwyMCAyNCBMMzAgMTIgTDg4IDEyIEw5OCAyMCBMOTggMjMgTDc1IDI1IEw1MCAyNSBMNDUgMzggTDM2IDM4IEw0MCAyNSBMMTIgMjUgWiIgZmlsbD0iIzg4NDdmZiIvPjxyZWN0IHg9IjMwIiB5PSI4IiB3aWR0aD0iMzUiIGhlaWdodD0iMyIgZmlsbD0iIzJjM2U1MCIvPjwvc3ZnPg==";

            const skins = [
                { id: 1, name: "AK-47 | Азимов", rarity: "covert", price: 450, img: imgAK },
                { id: 2, name: "M4A4 | Вой", rarity: "covert", price: 600, img: imgM4 },
                { id: 3, name: "AWP | Скоростной зверь", rarity: "classified", price: 250, img: imgAWP },
                { id: 4, name: "Glock-18 | Дух воды", rarity: "restricted", price: 120, img: imgAK },
                { id: 5, name: "USP-S | Сайрекс", rarity: "restricted", price: 70, img: imgM4 }
            ];

            let balance = 1000;
            let inventory = [];
            let isSpinning = false;
            let currentWin = null;

            const track = document.getElementById("track");
            const openBtn = document.getElementById("openBtn");

            // 1. ГЕНЕРАЦИЯ ЛЕНТЫ
            function buildTrack() {
                track.innerHTML = "";
                for (let i = 0; i < 60; i++) {
                    const skin = skins[Math.floor(Math.random() * skins.length)];
                    const card = document.createElement("div");
                    card.className = "skin-card " + skin.rarity;


card.innerHTML = <img src="${skin.img}" alt="skin"><div class="title">${skin.name}</div>;
                    card.dataset.id = skin.id;
                    track.appendChild(card);
                }
            }
            buildTrack();

            // 2. НАВИГАЦИЯ
            function setupNav(btnId, pageId) {
                const btn = document.getElementById(btnId);
                btn.addEventListener("click", function() {
                    if (isSpinning) return;
                    
                    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
                    document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
                    
                    document.getElementById(pageId).classList.add("active");
                    btn.classList.add("active");

                    if (pageId === "pInv") renderInventory();
                });
            }

            setupNav("btnCases", "pCases");
            setupNav("btnInv", "pInv");
            setupNav("btnProf", "pProf");

            // 3. ВРАЩЕНИЕ
            openBtn.addEventListener("click", function() {
                if (isSpinning) return;
                if (balance < 100) {
                    alert("Недостаточно кристаллов!");
                    return;
                }

                isSpinning = true;
                openBtn.disabled = true;
                balance -= 100;
                document.getElementById("balVal").innerText = balance;

                track.style.transition = "none";
                track.style.transform = "translateX(0px)";
                buildTrack();

                setTimeout(function() {
                    const cardWidth = 98;
                    const winIndex = 35;
                    const offset = Math.floor(Math.random() * 40) - 20;
                    const wrapperWidth = track.parentElement.offsetWidth;
                    const targetX = (winIndex * cardWidth) - (wrapperWidth / 2) + (cardWidth / 2) + offset;

                    track.style.transition = "transform 4.5s cubic-bezier(0.1, 0.8, 0.1, 1)";
                    track.style.transform = "translateX(-" + targetX + "px)";

                    setTimeout(function() {
                        const winCard = track.children[winIndex];
                        currentWin = skins.find(s => s.id == winCard.dataset.id);
                        showWinModal(currentWin);
                    }, 4700);
                }, 50);
            });

            // 4. ОКНО ВЫИГРЫША
            function showWinModal(skin) {
                document.getElementById("mImg").src = skin.img;
                document.getElementById("mTitle").innerText = skin.name;
                document.getElementById("mPrice").innerText = +${skin.price} 💎;
                document.getElementById("mSellBtn").innerText = Продать за ${skin.price} 💎;

                document.getElementById("winModal").classList.add("active");
            }

            document.getElementById("mSellBtn").onclick = function() {
                if (!currentWin) return;
                balance += currentWin.price;
                document.getElementById("balVal").innerText = balance;
                closeWinModal();
            };

            document.getElementById("mKeepBtn").onclick = function() {
                if (!currentWin) return;
                inventory.push({ ...currentWin, instId: Date.now() + Math.random() });
                closeWinModal();
            };

            function closeWinModal() {
                document.getElementById("winModal").classList.remove("active");
                currentWin = null;
                isSpinning = false;
                openBtn.disabled = false;
            }

            // 5. ИНВЕНТАРЬ
            function renderInventory() {
                const grid = document.getElementById("invGrid");
                grid.innerHTML = "";

                if (inventory.length === 0) {
                    grid.


innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #7f8c8d; font-size: 13px; margin-top: 20px;">Инвентарь пуст</p>';
                    return;
                }

                inventory.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "inv-card " + item.rarity;
                    card.innerHTML = `
                        <img src="${item.img}" alt="skin">
                        <div class="title">${item.name}</div>
                        <div class="price">${item.price} 💎</div>
                        <button class="btn btn-green" style="padding: 4px; font-size: 10px;" onclick="sellFromInv(${item.instId})">Продать</button>
                    `;
                    grid.appendChild(card);
                });
            }

            window.sellFromInv = function(instId) {
                const idx = inventory.findIndex(i => i.instId === instId);
                if (idx !== -1) {
                    balance += inventory[idx].price;
                    document.getElementById("balVal").innerText = balance;
                    inventory.splice(idx, 1);
                    renderInventory();
                }
            };
        });
    </script>
</body>
</html>
