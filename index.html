<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Case Drop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #0d0f17; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { height: 50px; background: #151824; border-bottom: 1px solid rgba(102, 252, 241, 0.2); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; flex-shrink: 0; }
        .header h1 { font-size: 14px; color: #66fcf1; font-weight: 900; }
        .balance { background: #0d0f17; padding: 4px 12px; border-radius: 20px; border: 1px solid #45a29e; font-size: 13px; font-weight: bold; color: #66fcf1; }
        
        .main-container { flex: 1; overflow-y: auto; padding: 12px; position: relative; }
        .page { display: none; flex-direction: column; width: 100%; }
        .page.active { display: flex; }
        
        .section-title { font-size: 12px; text-transform: uppercase; color: #8f9bba; font-weight: 800; margin: 12px 0 6px 0; }
        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; margin-bottom: 15px; }
        
        .case-card { 
            background: #181c2b; border-radius: 10px; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; border: 1px solid #23283b; cursor: pointer; position: relative;
        }
        .case-card:active { transform: scale(0.96); border-color: #66fcf1; }
        .case-card .name { font-size: 12px; font-weight: 700; margin-top: 6px; text-align: center; }
        .case-card .price { font-size: 11px; color: #66fcf1; margin-top: 4px; font-weight: bold; }
        .tag { position: absolute; top: 6px; right: 6px; font-size: 8px; padding: 2px 5px; border-radius: 4px; font-weight: 900; background: #2ecc71; color: #fff; }

        .roulette-box { position: relative; width: 100%; height: 110px; background: #121522; border: 2px solid #45a29e; border-radius: 12px; overflow: hidden; margin: 15px 0; }
        .roulette-line { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 2px; height: 100%; background: #66fcf1; z-index: 10; }
        .roulette-track { display: flex; height: 100%; position: absolute; left: 0; top: 0; }
        
        .skin-card { width: 90px; height: 85px; margin: 10px 4px; background: #181c2b; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; flex-shrink: 0; border-bottom: 3px solid #fff; }
        .skin-card .title { font-size: 8px; text-align: center; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        .trash { border-bottom-color: #b0c3d9; }
        .mil-spec { border-bottom-color: #4b69ff; }
        .restricted { border-bottom-color: #8847ff; }
        .classified { border-bottom-color: #d32ce6; }
        .covert { border-bottom-color: #eb4b4b; }
        .extraordinary { border-bottom-color: #ffd700; }

        .btn { width: 100%; background: #66fcf1; border: none; color: #0d0f17; padding: 12px; font-size: 13px; font-weight: 800; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn:active { opacity: 0.8; }
        .btn-green { background: #2ecc71; color: #fff; }
        .btn-blue { background: #3498db; color: #fff; }
        .btn-gray { background: #23283b; color: #ccc; }
        .btn-sm { padding: 8px; font-size: 11px; }

        .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .inv-card { background: #181c2b; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; border: 1px solid #23283b; }
        .inv-card .


title { font-size: 10px; text-align: center; margin: 4px 0; color: #aaa; }
        .inv-card .price { font-size: 11px; font-weight: bold; color: #2ecc71; margin-bottom: 6px; }
        .inv-btns { display: flex; gap: 4px; width: 100%; }
        .inv-btns button { flex: 1; border: none; padding: 5px; font-size: 9px; font-weight: bold; border-radius: 4px; cursor: pointer; color: #fff; }
        .btn-sell { background: #e74c3c; }
        .btn-withdraw { background: #3498db; }

        .profile-card { background: #181c2b; border-radius: 10px; padding: 12px; width: 100%; border: 1px solid #23283b; margin-bottom: 12px; }
        .input-field { width: 100%; background: #121522; border: 1px solid #45a29e; color: #fff; padding: 8px; border-radius: 6px; font-size: 11px; margin: 6px 0; outline: none; }

        .nav-bar { height: 50px; background: #151824; border-top: 1px solid rgba(102, 252, 241, 0.2); display: flex; width: 100%; flex-shrink: 0; z-index: 20; }
        .nav-item { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; color: #8f9bba; font-size: 11px; font-weight: 800; cursor: pointer; border: none; background: transparent; }
        .nav-item.active { color: #66fcf1; border-top: 2px solid #66fcf1; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-card { background: #181c2b; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #66fcf1; width: 85%; max-width: 300px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 CS2 CASES</h1>
        <div class="balance"><span id="balVal">1000</span> 💎</div>
    </div>

    <div class="main-container">
        <!-- СТРАНИЦА КЕЙСОВ -->
        <div id="pCases" class="page active">
            <div class="section-title">🎁 Бесплатные Кейсы</div>
            <div class="cases-grid" id="freeCasesGrid"></div>

            <div class="section-title">📦 Официальные Кейсы</div>
            <div class="cases-grid" id="officialCasesGrid"></div>
        </div>

        <!-- СТРАНИЦА ОТКРЫТИЯ -->
        <div id="pOpen" class="page">
            <button class="btn btn-sm btn-gray" onclick="switchTab('Cases')" style="width: auto; align-self: flex-start; margin-bottom: 10px;">← Назад</button>
            <h3 id="cName">Кейс</h3>
            <div class="roulette-box">
                <div class="roulette-line"></div>
                <div class="roulette-track" id="track"></div>
            </div>
            <button class="btn" onclick="spinRoulette()">Открыть</button>
        </div>

        <!-- ИНВЕНТАРЬ -->
        <div id="pInv" class="page">
            <div class="section-title">🎒 Ваш Инвентарь</div>
            <div class="inventory-grid" id="invGrid"></div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="pProf" class="page">
            <div class="profile-card" style="text-align: center;">
                <h3 id="uName">Пользователь</h3>
                <p id="uId" style="color: #8f9bba; font-size: 11px;">ID: ---</p>
            </div>

            <div class="profile-card">
                <div style="font-size: 12px; font-weight: 800; color: #66fcf1;">⚙️ Trade URL (для вывода)</div>
                <input type="text" id="profTradeUrlInput" class="input-field" placeholder="https://steamcommunity.com/tradeoffer/new/?partner=...">
                <button class="btn btn-blue btn-sm" onclick="saveTradeUrl()">Сохранить Trade URL</button>
            </div>

            <div class="profile-card">
                <div style="font-size: 12px; font-weight: 800; color: #66fcf1;">🔗 Реферальная ссылка</div>
                <input type="text" id="refLinkText" class="input-field" readonly>
                <div style="display: flex; gap: 6px; margin-top: 6px;">
                    <button class="btn btn-blue btn-sm" onclick="copyRefLink()" style="flex:1;">📋 Копировать</button>


<button class="btn btn-green btn-sm" onclick="shareRefLink()" style="flex:1;">📲 Отправить другу</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ВЫИГРЫША -->
    <div class="modal" id="winModal">
        <div class="modal-card">
            <h3 style="color: #66fcf1; font-size: 14px;">ВЫ ВЫБИЛИ!</h3>
            <h4 id="mTitle" style="font-size: 12px; margin: 10px 0; color: #fff;">---</h4>
            <p id="mPrice" style="color: #2ecc71; font-weight: bold; font-size: 13px; margin-bottom: 12px;">0 💎</p>
            <button class="btn btn-green" onclick="sellCurrentWin()" style="margin-bottom: 6px;">Продать</button>
            <button class="btn btn-gray" onclick="keepCurrentWin()">Оставить в инвентаре</button>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav-bar">
        <button class="nav-item active" id="tabCases" onclick="switchTab('Cases')">Кейсы</button>
        <button class="nav-item" id="tabInv" onclick="switchTab('Inv')">Инвентарь</button>
        <button class="nav-item" id="tabProf" onclick="switchTab('Prof')">Профиль</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try { tg.expand(); tg.ready(); } catch (e) {}
        }

        const userId = tg?.initDataUnsafe?.user?.id || "123456";
        const botUsername = "TestCSing_bot"; 
        const refLink = "https://t.me/" + botUsername + "?start=" + userId;

        let balance = parseInt(localStorage.getItem("cs_balance")) || 1000;
        let inventory = JSON.parse(localStorage.getItem("cs_inventory") || "[]");
        let savedTradeUrl = localStorage.getItem("cs_trade_url") || "";

        let currentCase = null;
        let isSpinning = false;
        let currentWin = null;

        const skinPool = [
            { id: 1, name: "P250 | Sand Dune", rarity: "trash", price: 5 },
            { id: 2, name: "Glock-18 | Water Elemental", rarity: "restricted", price: 120 },
            { id: 3, name: "AWP | Hyper Beast", rarity: "classified", price: 350 },
            { id: 4, name: "AK-47 | Asiimov", rarity: "covert", price: 1200 },
            { id: 5, name: "★ Butterfly Knife | Fade", rarity: "extraordinary", price: 15000 }
        ];

        const cases = [
            { id: "f1", name: "Free Start", price: 0, category: "free" },
            { id: "c1", name: "Kilowatt Case", price: 150, category: "official" },
            { id: "c2", name: "Revolution Case", price: 200, category: "official" }
        ];

        function initApp() {
            document.getElementById("uId").innerText = "ID: " + userId;
            document.getElementById("refLinkText").value = refLink;
            if (savedTradeUrl) document.getElementById("profTradeUrlInput").value = savedTradeUrl;
            updateUI();
            renderCases();
        }

        function saveData() {
            localStorage.setItem("cs_balance", balance);
            localStorage.setItem("cs_inventory", JSON.stringify(inventory));
            localStorage.setItem("cs_trade_url", savedTradeUrl);
        }

        function updateUI() {
            document.getElementById("balVal").innerText = balance;
        }

        function switchTab(tab) {
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
            
            if (tab === 'Cases') {
                document.getElementById("pCases").classList.add("active");
                document.getElementById("tabCases").classList.add("active");
            } else if (tab === 'Inv') {
                document.getElementById("pInv").classList.add("active");
                document.getElementById("tabInv").classList.add("active");
                renderInventory();
            } else if (tab === 'Prof') {
                document.getElementById("pProf").classList.add("active");
                document.getElementById("tabProf").classList.add("active");


} else if (tab === 'Open') {
                document.getElementById("pOpen").classList.add("active");
            }
        }

        function renderCases() {
            const freeG = document.getElementById("freeCasesGrid");
            const offG = document.getElementById("officialCasesGrid");
            freeG.innerHTML = ""; offG.innerHTML = "";

            cases.forEach(c => {
                const el = document.createElement("div");
                el.className = "case-card";
                el.onclick = function() { openCasePage(c); };
                el.innerHTML = `
                    ${c.price === 0 ? '<div class="tag">FREE</div>' : ''}
                    <div class="name">${c.name}</div>
                    <div class="price">${c.price > 0 ? c.price + " 💎" : "БЕСПЛАТНО"}</div>
                `;
                
                if (c.category === "free") freeG.appendChild(el);
                else offG.appendChild(el);
            });
        }

        function openCasePage(c) {
            currentCase = c;
            document.getElementById("cName").innerText = c.name;
            switchTab('Open');
            buildTrack();
        }

        function buildTrack() {
            const track = document.getElementById("track");
            track.innerHTML = "";
            for (let i = 0; i < 50; i++) {
                const skin = skinPool[Math.floor(Math.random() * skinPool.length)];
                const card = document.createElement("div");
                card.className = skin-card ${skin.rarity};
                card.innerHTML = <div class="title">${skin.name}</div>;
                card.dataset.id = skin.id;
                track.appendChild(card);
            }
        }

        function spinRoulette() {
            if (isSpinning || !currentCase) return;
            if (currentCase.price > balance) {
                alert("Недостаточно 💎!");
                return;
            }

            isSpinning = true;
            balance -= currentCase.price;
            updateUI();
            saveData();

            const track = document.getElementById("track");
            track.style.transition = "none";
            track.style.transform = "translateX(0px)";
            buildTrack();

            setTimeout(() => {
                const cardWidth = 98;
                const winIndex = 30;
                const targetX = (winIndex * cardWidth) - (track.parentElement.offsetWidth / 2) + (cardWidth / 2);

                track.style.transition = "transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)";
                track.style.transform = translateX(-${targetX}px);

                setTimeout(() => {
                    const winId = track.children[winIndex].dataset.id;
                    currentWin = skinPool.find(s => s.id == winId) || skinPool[0];
                    showWinModal(currentWin);
                }, 4200);
            }, 50);
        }

        function showWinModal(skin) {
            document.getElementById("mTitle").innerText = skin.name;
            document.getElementById("mPrice").innerText = "+" + skin.price + " 💎";
            document.getElementById("winModal").classList.add("active");
        }

        function sellCurrentWin() {
            if (!currentWin) return;
            balance += currentWin.price;
            updateUI();
            saveData();
            closeWinModal();
        }

        function keepCurrentWin() {
            if (!currentWin) return;
            inventory.push(Object.assign({}, currentWin));
            saveData();
            closeWinModal();
        }

        function closeWinModal() {
            document.getElementById("winModal").classList.remove("active");
            currentWin = null;
            isSpinning = false;
        }

        function renderInventory() {
            const grid = document.getElementById("invGrid");
            grid.innerHTML = "";
            if (inventory.length === 0) {
                grid.


innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #8f9bba; font-size: 12px; margin-top: 20px;">Инвентарь пуст</p>';
                return;
            }

            inventory.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "inv-card";
                card.innerHTML = `
                    <div class="title">${item.name}</div>
                    <div class="price">${item.price} 💎</div>
                    <div class="inv-btns">
                        <button class="btn-sell" onclick="sellInvItem(${index})">Продать</button>
                        <button class="btn-withdraw" onclick="withdrawInvItem(${index})">Вывести</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function sellInvItem(index) {
            balance += inventory[index].price;
            inventory.splice(index, 1);
            saveData();
            updateUI();
            renderInventory();
        }

        function withdrawInvItem(index) {
            if (!savedTradeUrl || savedTradeUrl.trim() === "") {
                alert("⚠️ Вы не указали Trade URL!\n\nПерейдите в раздел 'Профиль' и сохраните ссылку на обмен.");
                switchTab('Prof');
                return;
            }
            alert(`✅ Заявка на вывод предмета "${inventory[index].name}" отправлена на ваш Trade URL!`);
            inventory.splice(index, 1);
            saveData();
            renderInventory();
        }

        function saveTradeUrl() {
            const val = document.getElementById("profTradeUrlInput").value.trim();
            if (!val) {
                alert("Введите Trade URL!");
                return;
            }
            savedTradeUrl = val;
            saveData();
            alert("✅ Trade URL успешно сохранён!");
        }

        function copyRefLink() {
            navigator.clipboard.writeText(refLink);
            alert("Ссылка скопирована!");
        }

        function shareRefLink() {
            const shareUrl = "https://t.me/share/url?url=" + encodeURIComponent(refLink) + "&text=" + encodeURIComponent("Открывай бесплатные кейсы CS2!");
            if (tg?.openTelegramLink) tg.openTelegramLink(shareUrl);
            else window.open(shareUrl, "_blank");
        }

        window.onload = initApp;
    </script>
</body>
</html>
