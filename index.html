<button class="btn-open" style="margin-top: 15px;" onclick="closeModal()">Забрать</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Скины для рулетки
        const skins = [
            { name: "AK-47 | Азимов", rarity: "rarity-covert", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d11V2yp1OH6-m4cCoU4BoR63B&/150fx150f" },
            { name: "M4A4 | Вой", rarity: "rarity-covert", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d11V2yp1OH6-m4cCoU4BoR63B&/150fx150f" },
            { name: "AWP | Скоростной зверь", rarity: "rarity-classified", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d11V2yp1OH6-m4cCoU4BoR63B&/150fx150f" },
            { name: "Glock-18 | Дух воды", rarity: "rarity-restricted", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d11V2yp1OH6-m4cCoU4BoR63B&/150fx150f" },
            { name: "USP-S | Сайрекс", rarity: "rarity-mil-spec", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZFCb4d11V2yp1OH6-m4cCoU4BoR63B&/150fx150f" }
        ];

        const track = document.getElementById('track');
        const openBtn = document.getElementById('openBtn');
        let isSpinning = false;

        // Генерация элементов рулетки
        function generateTrack() {
            track.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const randomSkin = skins[Math.floor(Math.random() * skins.length)];
                const card = document.createElement('div');
                card.className = item-card ${randomSkin.rarity};
                card.innerHTML = `
                    <img src="${randomSkin.img}" alt="${randomSkin.name}">
                    <div class="name">${randomSkin.name}</div>
                `;
                card.dataset.name = randomSkin.name;
                card.dataset.img = randomSkin.img;
                track.appendChild(card);
            }
        }

        // Эмуляция загрузки приложения
        window.addEventListener('load', () => {
            generateTrack();
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.visibility = 'hidden', 500);
            }, 1200); // Прелоадер виден 1.2 секунды
        });

        // Функция вращения рулетки
        function spinRoulette() {
            if (isSpinning) return;
            isSpinning = true;
            openBtn.disabled = true;

            // Сброс позиции
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            // Генерация нового трека
            generateTrack();

            setTimeout(() => {
                const itemWidth = 110; // ширина карточки + margin
                const winIndex = 45; // Предмет, который остановится под указателем
                const winningCard = track.children[winIndex];

                // Расчет смещения
                const offset = (winIndex * itemWidth) - (document.querySelector('.roulette-wrapper').offsetWidth / 2) + (itemWidth / 2);

                track.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.2, 1)';
                track.style.transform = translateX(-${offset}px);

                // Показ результата после прокрутки
                setTimeout(() => {
                    document.getElementById('winName').innerText = winningCard.dataset.name;
                    document.getElementById('winImg').src = winningCard.dataset.img;
                    document.getElementById('winModal').classList.add('active');
                    
                    // Вибрация от Telegram WebApp при победе
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                }, 5200);
            }, 50);
        }

        function closeModal() {
            document.getElementById('winModal').classList.remove('active');
            isSpinning = false;
            openBtn.disabled = false;
        }
    </script>
</body>
</html>
