<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Case Drop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d0f17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            height: 50px;
            background: #151824;
            border-bottom: 1px solid rgba(102, 252, 241, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 14px;
            color: #66fcf1;
            font-weight: 900;
        }
        .balance {
            background: #0d0f17;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #45a29e;
            font-size: 13px;
            font-weight: bold;
            color: #66fcf1;
        }
        
        .main-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            position: relative;
        }
        .page {
            display: none;
            flex-direction: column;
            width: 100%;
        }
        .page.active {
            display: flex;
        }
        
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #8f9bba;
            font-weight: 800;
            margin: 12px 0 6px 0;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .case-card { 
            background: #181c2b; 
            border-radius: 10px; 
            padding: 14px 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            border: 1px solid #23283b; 
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: transform 0.1s, border-color 0.1s;
        }
        .case-card:active { 
            transform: scale(0.96); 
            border-color: #66fcf1; 
        }
        .case-card .name { 
            font-size: 12px; 
            font-weight: 700; 
            margin-top: 6px; 
            text-align: center; 
            pointer-events: none; 
        }
        .case-card .price { 
            font-size: 11px; 
            color: #66fcf1; 
            margin-top: 4px; 
            font-weight: bold; 
            pointer-events: none; 
        }

        .roulette-box { 
            position: relative; 
            width: 100%; 
            height: 110px; 
            background: #121522; 
            border: 2px solid #45a29e; 
            border-radius: 12px; 
            overflow: hidden; 
            margin: 15px 0; 
        }
        .roulette-line { 
            position: absolute; 
            top: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 2px; 
            height: 100%; 
            background: #66fcf1; 
            z-index: 10; 
        }
        .roulette-track { 
            display: flex; 
            height: 100%; 
            position: absolute; 
            left: 0; 
            top: 0; 
        }

        .btn { 
            width: 100%; 
            background: #66fcf1; 
            border: none; 
            color: #0d0f17; 
            padding: 12px; 
            font-size: 13px; 
            font-weight: 800;


border-radius: 8px; 
            cursor: pointer; 
        }
        .btn:active { opacity: 0.8; }

        .nav-bar { 
            height: 50px; 
            background: #151824; 
            border-top: 1px solid rgba(102, 252, 241, 0.2); 
            display: flex; 
            width: 100%; 
            flex-shrink: 0; 
            z-index: 20;
        }
        .nav-item { 
            flex: 1; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #8f9bba; 
            font-size: 11px; 
            font-weight: 800; 
            cursor: pointer; 
            border: none; 
            background: transparent; 
        }
        .nav-item.active { 
            color: #66fcf1; 
            border-top: 2px solid #66fcf1; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 CS2 CASES</h1>
        <div class="balance"><span id="balVal">1000</span> 💎</div>
    </div>

    <div class="main-container">
        <!-- СТРАНИЦА КЕЙСОВ -->
        <div id="pCases" class="page active">
            <div class="section-title">🎁 Бесплатные Кейсы</div>
            <div class="cases-grid" id="freeCasesGrid"></div>

            <div class="section-title">📦 Официальные Кейсы</div>
            <div class="cases-grid" id="officialCasesGrid"></div>
        </div>

        <!-- СТРАНИЦА ОТКРЫТИЯ -->
        <div id="pOpen" class="page">
            <button class="btn" id="backBtn" style="width: auto; padding: 6px 12px; margin-bottom: 10px;">← Назад</button>
            <h3 id="cName">Кейс</h3>
            <div class="roulette-box">
                <div class="roulette-line"></div>
                <div class="roulette-track" id="track"></div>
            </div>
            <button class="btn" id="spinBtn">Открыть</button>
        </div>

        <!-- СТРАНИЦА ПРОФИЛЯ -->
        <div id="pProf" class="page">
            <h3 style="margin-bottom: 10px;">Профиль</h3>
            <p id="uId" style="margin-bottom: 15px; color: #8f9bba;">ID: ---</p>
            <div class="section-title">Реферальная ссылка:</div>
            <input type="text" id="refLink" style="width:100%; padding: 10px; background:#181c2b; border:1px solid #45a29e; color:#fff; border-radius:6px;" readonly>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" id="tabCases">Кейсы</button>
        <button class="nav-item" id="tabProf">Профиль</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.expand();
                tg.ready();
            }

            const userId = tg?.initDataUnsafe?.user?.id || "123456";
            document.getElementById("uId").innerText = "ID: " + userId;
            document.getElementById("refLink").value = "https://t.me/TestCSing_bot?start=" + userId;

            const cases = [
                { id: "f1", name: "Free Start", price: 0, category: "free" },
                { id: "f2", name: "Daily Bonus", price: 0, category: "free" },
                { id: "c1", name: "Kilowatt Case", price: 150, category: "official" },
                { id: "c2", name: "Revolution Case", price: 200, category: "official" },
                { id: "c3", name: "Recoil Case", price: 120, category: "official" },
                { id: "c4", name: "Dreams & Nightmares", price: 180, category: "official" }
            ];

            function renderCases() {
                const freeG = document.getElementById("freeCasesGrid");
                const offG = document.getElementById("officialCasesGrid");
                
                freeG.innerHTML = "";
                offG.innerHTML = "";

                cases.forEach(c => {
                    const el = document.createElement("div");
                    el.className = "case-card";
                    el.innerHTML = `
                        <div class="name">${c.name}</div>


<div class="price">${c.price > 0 ? c.price + " 💎" : "БЕСПЛАТНО"}</div>
                    `;
                    
                    el.addEventListener("click", () => {
                        document.getElementById("cName").innerText = c.name;
                        switchTab("Open");
                    });

                    if (c.category === "free") {
                        freeG.appendChild(el);
                    } else {
                        offG.appendChild(el);
                    }
                });
            }

            function switchTab(tab) {
                document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
                document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
                
                if (tab === "Cases") {
                    document.getElementById("pCases").classList.add("active");
                    document.getElementById("tabCases").classList.add("active");
                } else if (tab === "Prof") {
                    document.getElementById("pProf").classList.add("active");
                    document.getElementById("tabProf").classList.add("active");
                } else if (tab === "Open") {
                    document.getElementById("pOpen").classList.add("active");
                }
            }

            document.getElementById("tabCases").addEventListener("click", () => switchTab("Cases"));
            document.getElementById("tabProf").addEventListener("click", () => switchTab("Prof"));
            document.getElementById("backBtn").addEventListener("click", () => switchTab("Cases"));

            renderCases();
        });
    </script>
</body>
</html>
