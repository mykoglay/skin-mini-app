<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ECODROP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a0e; --panel:#171319; --panel2:#1e1922; --line:#2c2530;
  --acc:#8b5cf6; --acc-dim:#4c2f96; --text:#f2ede9; --sub:#9a8f9c;
  --trash:#8a9bb5; --mil:#4f79ff; --restr:#9a5bff; --classi:#e14bd8; --covert:#ff4655; --gold:#ffbe3d;
  --green:#3ddc84; --red:#ff5566;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;}
body{background:radial-gradient(ellipse at top,#1c1420 0%,#0b0a0e 55%,#070609 100%); color:var(--text); font-family:'Chakra Petch',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
h1,h2,h3,.display{font-family:'Rajdhani',sans-serif;}

#loader{position:fixed; inset:0; z-index:9999; background:#070609; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; transition:opacity .5s ease, visibility .5s ease;}
#loader.hide{opacity:0; visibility:hidden; pointer-events:none;}
.loader-mark{width:74px; height:74px; position:relative;}
.loader-mark svg{width:100%;height:100%;}
.loader-ring{fill:none; stroke:var(--acc); stroke-width:3; stroke-linecap:round; stroke-dasharray:180; stroke-dashoffset:180; animation:ringspin 1.4s ease-in-out infinite, ringrotate 1.6s linear infinite; transform-origin:50% 50%;}
@keyframes ringspin{0%{stroke-dashoffset:180;}50%{stroke-dashoffset:40;}100%{stroke-dashoffset:180;}}
@keyframes ringrotate{to{transform:rotate(360deg);}}
.loader-word{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:.14em; color:var(--sub);}
.loader-bar{width:160px; height:2px; background:#241d28; border-radius:2px; overflow:hidden;}
.loader-bar i{display:block; height:100%; width:30%; background:var(--acc); border-radius:2px; animation:barmove 1.1s ease-in-out infinite;}
@keyframes barmove{0%{transform:translateX(-120%);}100%{transform:translateX(420%);}}

.header{height:56px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 14px; flex-shrink:0; gap:10px;}
.brand{display:flex; align-items:center; gap:8px; border:none; background:none; padding:6px 4px; margin:-6px -4px; cursor:pointer; border-radius:10px; -webkit-tap-highlight-color:transparent;}
.brand:active{transform:scale(.94); background:rgba(139,92,246,.12);}
