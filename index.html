<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>CS2 Cases</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #0d0e12; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .header { height: 50px; background: #14161f; border-bottom: 1px solid #252836; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; flex-shrink: 0; }
        .header h1 { font-size: 15px; color: #f39c12; font-weight: 800; }
        .balance { background: #1a1d29; padding: 6px 12px; border-radius: 20px; border: 1px solid #252836; font-size: 13px; font-weight: bold; }
        
        .main-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .page { display: none; width: 100%; height: 100%; padding: 16px; flex-direction: column; align-items: center; overflow-y: auto; }
        .page.active { display: flex; }
        
        .roulette-box { position: relative; width: 100%; height: 110px; background: #14161f; border: 2px solid #252836; border-radius: 12px; overflow: hidden; margin-bottom: 15px; flex-shrink: 0; }
        .roulette-line { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 3px; height: 100%; background: #f39c12; z-index: 10; box-shadow: 0 0 8px #f39c12; }
        .roulette-track { display: flex; height: 100%; position: absolute; left: 0; top: 0; width: max-content; }
        
        .skin-card { width: 90px; height: 85px; margin: 10px 4px; background: #1a1d29; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; border-bottom: 4px solid #fff; flex-shrink: 0; }
        .gun-badge { width: 50px; height: 26px; border-radius: 4px; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; }
        .skin-card .title { font-size: 9px; text-align: center; color: #ddd; font-weight: 600; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .covert { border-bottom-color: #eb4b4b; background: linear-gradient(180deg, #1a1d29 20%, rgba(235, 75, 75, 0.35)); }
        .classified { border-bottom-color: #d32ce6; background: linear-gradient(180deg, #1a1d29 20%, rgba(211, 44, 230, 0.35)); }
        .restricted { border-bottom-color: #8847ff; background: linear-gradient(180deg, #1a1d29 20%, rgba(136, 71, 255, 0.35)); }
        
        .case-card { width: 100%; background: #14161f; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; border: 1px solid #252836; }
        .case-icon { width: 80px; height: 60px; background: #f39c12; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        
        .btn { width: 100%; background: #f39c12; border: none; color: #fff; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; text-align: center; }
        .btn:disabled { opacity: 0.4; }
        .btn-green { background: #27ae60; }
        .btn-gray { background: #252836; color: #ccc; }
        
        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .inv-card { background: #14161f; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; border: 1px solid #252836; }
        .inv-card .title { font-size: 9px; text-align: center; color: #aaa; margin: 4px 0; }
        .inv-card .


price { font-size: 11px; font-weight: bold; color: #2ec771; margin-bottom: 6px; }
        .btn-sell-inv { background: #27ae60; border: none; color: white; border-radius: 4px; padding: 4px 8px; font-size: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 4px; }
        
        .nav-bar { height: 60px; background: #14161f; border-top: 1px solid #252836; display: flex; flex-direction: row; justify-content: space-around; align-items: center; width: 100%; flex-shrink: 0; z-index: 100; }
        .nav-item { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; color: #7f8c8d; font-size: 13px; font-weight: bold; cursor: pointer; background: transparent; border: none; }
        .nav-item.active { color: #f39c12; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); z-index: 999; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-card { background: #1a1d29; padding: 20px; border-radius: 16px; text-align: center; border: 2px solid #f39c12; width: 85%; max-width: 300px; }
        
        .user-card { background: #14161f; border: 1px solid #252836; border-radius: 12px; padding: 20px; width: 100%; text-align: center; }
        .user-avatar { width: 60px; height: 60px; background: #f39c12; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 24px; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 CS2 CASES</h1>
        <div class="balance"><span id="balVal">1000</span> 💎</div>
    </div>

    <div class="main-container">
        <div id="pCases" class="page active">
            <div class="roulette-box">
                <div class="roulette-line"></div>
                <div class="roulette-track" id="track"></div>
            </div>

            <div class="case-card">
                <div class="case-icon">🧰</div>
                <button class="btn" id="openBtn">Открыть за 100 💎</button>
            </div>
        </div>

        <div id="pInv" class="page">
            <div class="inventory-grid" id="invGrid"></div>
        </div>

        <div id="pProf" class="page">
            <div class="user-card">
                <div class="user-avatar" id="uAvatar">U</div>
                <h3 id="uName" style="font-size: 16px; margin-bottom: 4px;">Пользователь</h3>
                <p id="uId" style="color: #7f8c8d; font-size: 12px;">ID: ---</p>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" id="btnCases">Кейсы</button>
        <button class="nav-item" id="btnInv">Инвентарь</button>
        <button class="nav-item" id="btnProf">Профиль</button>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-card">
            <h2 style="color: #f39c12; font-size: 16px;">ВЫ ВЫБИЛИ!</h2>
            <div id="mShapeBox" style="margin: 15px 0; display: flex; justify-content: center;"></div>
            <h3 id="mTitle" style="font-size: 13px; color: #fff;">---</h3>
            <p id="mPrice" style="color: #2ec771; font-weight: bold; font-size: 13px; margin: 8px 0;">0 💎</p>
            <button class="btn btn-green" id="mSellBtn" style="margin-bottom: 8px;">Продать</button>
            <button class="btn btn-gray" id="mKeepBtn">Оставить</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
            if (tg) {
                tg.expand();
                tg.ready();
            }

            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                var user = tg.initDataUnsafe.user;
                var name = user.first_name + (user.last_name ? " " + user.last_name : "");
                document.getElementById("uName").innerText = name;
                document.getElementById("uId").innerText = "ID: " + user.id;


document.getElementById("uAvatar").innerText = user.first_name ? user.first_name.charAt(0).toUpperCase() : "U";
            }

            var skins = [
                { id: 1, name: "AK-47 | Asiimov", rarity: "covert", price: 450, tag: "AK-47", bg: "#e74c3c" },
                { id: 2, name: "M4A4 | Howl", rarity: "covert", price: 600, tag: "M4A4", bg: "#c0392b" },
                { id: 3, name: "AWP | Hyper Beast", rarity: "classified", price: 250, tag: "AWP", bg: "#2ecc71" },
                { id: 4, name: "Glock-18 | Water", rarity: "restricted", price: 120, tag: "Glock", bg: "#2980b9" },
                { id: 5, name: "USP-S | Cyrex", rarity: "restricted", price: 70, tag: "USP-S", bg: "#8e44ad" }
            ];

            // Загрузка сохранённого состояния из localStorage
            var balance = parseInt(localStorage.getItem("cs_balance"));
            if (isNaN(balance)) balance = 1000;

            var inventory = [];
            try {
                var savedInv = localStorage.getItem("cs_inventory");
                if (savedInv) inventory = JSON.parse(savedInv);
            } catch(e) { inventory = []; }

            var isSpinning = false;
            var currentWin = null;

            var track = document.getElementById("track");
            var openBtn = document.getElementById("openBtn");

            // Функция сохранения данных в память браузера
            function saveData() {
                localStorage.setItem("cs_balance", balance);
                localStorage.setItem("cs_inventory", JSON.stringify(inventory));
            }

            function updateBalanceUI() {
                document.getElementById("balVal").innerText = balance;
            }

            function buildTrack() {
                track.innerHTML = "";
                for (var i = 0; i < 60; i++) {
                    var skin = skins[Math.floor(Math.random() * skins.length)];
                    var card = document.createElement("div");
                    card.className = "skin-card " + skin.rarity;
                    card.innerHTML = '<div class="gun-badge" style="background:' + skin.bg + '">' + skin.tag + '</div><div class="title">' + skin.name + '</div>';
                    card.dataset.id = skin.id;
                    track.appendChild(card);
                }
            }

            function spinRoulette() {
                if (isSpinning) return;
                if (balance < 100) {
                    alert("Недостаточно кристаллов!");
                    return;
                }

                isSpinning = true;
                openBtn.disabled = true;
                balance -= 100;
                updateBalanceUI();
                saveData();

                track.style.transition = "none";
                track.style.transform = "translateX(0px)";
                buildTrack();

                setTimeout(function() {
                    var cardWidth = 98;
                    var winIndex = 35;
                    var offset = Math.floor(Math.random() * 40) - 20;
                    var wrapperWidth = track.parentElement.offsetWidth;
                    var targetX = (winIndex * cardWidth) - (wrapperWidth / 2) + (cardWidth / 2) + offset;

                    track.style.transition = "transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)";
                    track.style.transform = "translateX(-" + targetX + "px)";

                    setTimeout(function() {
                        var winCard = track.children[winIndex];
                        var winId = winCard.dataset.id;
                        for (var k = 0; k < skins.length; k++) {
                            if (skins[k].id == winId) {
                                currentWin = skins[k];
                                break;
                            }
                        }
                        showWinModal(currentWin);
                    }, 4200);
                }, 50);
            }

            function showWinModal(skin) {
                document.getElementById("mShapeBox").


innerHTML = '<div class="gun-badge" style="background:' + skin.bg + '; width: 80px; height: 40px; font-size: 14px;">' + skin.tag + '</div>';
                document.getElementById("mTitle").innerText = skin.name;
                document.getElementById("mPrice").innerText = "+" + skin.price + " 💎";
                document.getElementById("mSellBtn").innerText = "Продать за " + skin.price + " 💎";
                document.getElementById("winModal").classList.add("active");
            }

            document.getElementById("mSellBtn").onclick = function() {
                if (!currentWin) return;
                balance += currentWin.price;
                updateBalanceUI();
                saveData();
                closeWinModal();
            };

            document.getElementById("mKeepBtn").onclick = function() {
                if (!currentWin) return;
                // Присваиваем уникальный ID экземпляра для корректной продажи
                var skinItem = Object.assign({}, currentWin, { instanceId: Date.now() + Math.random() });
                inventory.push(skinItem);
                saveData();
                closeWinModal();
            };

            function closeWinModal() {
                document.getElementById("winModal").classList.remove("active");
                currentWin = null;
                isSpinning = false;
                openBtn.disabled = false;
            }

            function switchTab(tabName, btnElem) {
                if (isSpinning) return;
                var pages = document.querySelectorAll(".page");
                for (var i = 0; i < pages.length; i++) pages[i].classList.remove("active");
                var navs = document.querySelectorAll(".nav-item");
                for (var j = 0; j < navs.length; j++) navs[j].classList.remove("active");

                document.getElementById("p" + tabName).classList.add("active");
                btnElem.classList.add("active");

                if (tabName === "Inv") renderInventory();
            }

            function renderInventory() {
                var grid = document.getElementById("invGrid");
                grid.innerHTML = "";
                if (inventory.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #7f8c8d; font-size: 13px; margin-top: 20px;">Инвентарь пуст</p>';
                    return;
                }

                for (var i = 0; i < inventory.length; i++) {
                    (function(index) {
                        var item = inventory[index];
                        var card = document.createElement("div");
                        card.className = "inv-card " + item.rarity;
                        card.innerHTML = 
                            '<div class="gun-badge" style="background:' + item.bg + '">' + item.tag + '</div>' +
                            '<div class="title">' + item.name + '</div>' +
                            '<div class="price">' + item.price + ' 💎</div>' +
                            '<button class="btn-sell-inv">Продать</button>';
                        
                        // Обработка продажи предмета из инвентаря
                        card.querySelector(".btn-sell-inv").onclick = function() {
                            balance += item.price;
                            inventory.splice(index, 1);
                            saveData();
                            updateBalanceUI();
                            renderInventory();
                        };

                        grid.appendChild(card);
                    })(i);
                }
            }

            openBtn.onclick = spinRoulette;
            document.getElementById("btnCases").onclick = function() { switchTab('Cases', this); };
            document.getElementById("btnInv").onclick = function() { switchTab('Inv', this); };
            document.getElementById("btnProf").onclick = function() { switchTab('Prof', this); };

            updateBalanceUI();
            buildTrack();
        });
    </script>
</body>
</html>
